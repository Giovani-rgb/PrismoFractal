################################################
# APPLICATION INFO
################################################

spring.application.name=${APP_NAME}
application.version=${VERSIONATED}
app.environment=${ENV}
app.session.secret=${APP_SESSION_SECRET}
################################################
# SERVER CONFIGURATION
################################################

server.port=${PORT:5000}
server.servlet.context-path=/

################################################
# BANNER CONFIG
################################################

spring.main.banner-mode=console

################################################
# ADMIN DEFAULT CONFIG
################################################

app.admin.username=admin
app.admin.password=admin123
app.admin.role=ROLE_ADMIN

################################################
# LOGGING
################################################

logging.level.root=INFO
logging.level.org.springframework=INFO

################################################
# JVM / PERFORMANCE (optional future tuning)
################################################

spring.output.ansi.enabled=ALWAYS




################################################
# Connection Db Supabase
################################################

spring.datasource.url=${URL_DATA_SOURCE}
spring.datasource.username=${USERNAME_DATABASE}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.auto-commit=true

# Pode ser o valor direto ou uma referência à variável de ambiente do .env
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

spring.jpa.open-in-view=false




