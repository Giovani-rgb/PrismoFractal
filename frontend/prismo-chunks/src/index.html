<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.minepi.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.minepi.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <title>Prismo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
</head>
<body>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <app-root></app-root>

  <script>
    // Handler global — suprime rejeições Axios não capturadas do Pi SDK
    window.addEventListener('unhandledrejection', function(event) {
      var r = event.reason;
      if (r && (
        r.name === 'AxiosError' ||
        (typeof r.message === 'string' && r.message.toLowerCase().includes('network error')) ||
        (r.config && typeof (r.config.url || r.config.baseURL) === 'string' &&
          (r.config.url || r.config.baseURL || '').includes('minepi'))
      )) {
        event.preventDefault();
        console.warn('[Pi SDK] Axios interno suprimido:', r.message || r.name);
      }
    });
    // Pi.init() é chamado pelo Angular via NgZone.runOutsideAngular — não aqui
    window.__piSdkReady = false;
  </script>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    // Usando um listener para garantir que o Eruda só inicialize após o script carregar
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof eruda !== 'undefined') eruda.init();
    });
  </script>

</body>
</html>
