<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.minepi.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.minepi.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <title>Prismo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  
  <app-root></app-root>

  
  <script>
    // Handler global — suprime rejeições Axios internas do Pi SDK
    // (o SDK dispara promises não capturadas quando fora do Pi Browser)
    window.addEventListener('unhandledrejection', function(event) {
      var r = event.reason;
      if (
        r && (
          r.name === 'AxiosError' ||
          (typeof r.message === 'string' && r.message.toLowerCase().includes('axios')) ||
          (r.config && r.config.baseURL && typeof r.config.baseURL === 'string' && r.config.baseURL.includes('minepi')) ||
          (r.config && r.config.url && typeof r.config.url === 'string' && r.config.url.includes('minepi'))
        )
      ) {
        event.preventDefault();
        console.warn('[Pi SDK] Axios interno suprimido (fora do Pi Browser):', r.message || r);
      }
    });

    // Inicializa o SDK em sandbox com proteção — não bloqueia o app se falhar
    try {
      Pi.init({ version: "2.0", sandbox: true });
      window.__piSdkReady = true;
    } catch(e) {
      window.__piSdkReady = false;
      console.warn('[Pi SDK] Falha na inicialização:', e.message);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

</body>
</html>
