<div class="overlay ">
  <div class="menu">
    <div
      class="menu-item no-select"
      *ngFor="let item of items; let i = index"
      [class.active]="i === selectedIndex"
      (mouseenter)="selectedIndex = i"
      (click)="select(i)"
    >
      <span
        class="arrow"
        *ngIf="i === selectedIndex"
      >
        ▶
      </span>

      {{ item.label }}
    </div>
  </div>
</div>
